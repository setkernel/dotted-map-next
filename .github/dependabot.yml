# Dependabot opens the weekly dependency PRs. Unlike a GITHUB_TOKEN-created
# PR, Dependabot PRs run CI, and the `auto-merge-dependency-updates` job in
# ci.yml can act on them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # >>> setkernel version holds (generated by setkernel/agent-plugins bin/dependabot-policy; don't edit)
      #     https://github.com/setkernel/agent-plugins/blob/main/policy/versions.json
      - dependency-name: '@types/node' # node-24
        versions: ['>=25']
      - dependency-name: 'typescript' # typescript-6.0
        versions: ['>=6.1.0']
      # <<< setkernel version holds
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
