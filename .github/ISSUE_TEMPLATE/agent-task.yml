name: Agent task
description: Work for the dev VM agents. Assigned automatically unless you pick someone.
labels: ["agent-ready"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Code
        - Research / docs
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist the reviewer will verify.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / pointers
      description: Files, links, constraints, things not to touch.
